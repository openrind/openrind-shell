name: Publish sandbox image

on:
  push:
    branches: [just-bash]
    paths:
      - 'openrind-shell-js/**'
      - '.claude/skills/**'
      - '.dockerignore'
      - 'sandboxes/openrind-shell/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  # Do NOT cancel an in-progress publish. The first cold build must run the
  # heavy OpenClaw prewarm to completion so that layer lands in the GHA layer
  # cache; cancelling it (the old `cancel-in-progress: true`) meant a rapid
  # series of pushes kept killing the build before the prewarm layer could be
  # cached, so every run restarted the ~40-min prewarm from scratch and none
  # ever finished ("The operation was canceled"). Letting builds queue and
  # complete warms the cache once; after that, iterating on setup.sh /
  # openrind-shell-js only rebuilds the fast layers above the cached prewarm.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Canonical image base — hardcoded so the published name never changes
  # when the workflow runs in a fork or after a repo transfer/rename.
  IMAGE_BASE: ghcr.io/openrind/openrind-shell

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openrind-shell
          POSTGRES_PASSWORD: openrind-shell
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openrind-shell"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: openrind-shell-js
        run: pnpm install

      - name: Typecheck
        working-directory: openrind-shell-js
        run: pnpm typecheck

      - name: Lint
        working-directory: openrind-shell-js
        run: pnpm lint

      - name: Unit tests
        working-directory: openrind-shell-js
        run: pnpm test

      - name: Build
        working-directory: openrind-shell-js
        run: pnpm build

      - name: Integration tests
        working-directory: openrind-shell-js
        env:
          DATABASE_URL: postgresql://openrind-shell:openrind-shell@localhost:5432/testdb
        run: node test-integration.mjs

      - name: Validate setup.sh syntax (claude and openclaw paths)
        run: |
          bash -n sandboxes/openrind-shell/setup.sh
          grep -q 'OPENRIND_SHELL_AGENT' sandboxes/openrind-shell/setup.sh
          grep -q 'openclaw' sandboxes/openrind-shell/setup.sh

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    # The OpenClaw prewarm layer is heavy (stages npm deps + runs the TUI twice
    # to bake the plugin + compile caches). Give the job a generous but bounded
    # budget so a genuinely stuck build fails clearly instead of hanging for the
    # 6-hour default (which would also block the no-cancel concurrency queue).
    # A warm GHA layer cache makes subsequent builds far faster.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The prewarm stages dozens of npm packages and bakes a ~46 MB compile
      # cache on top of a large base image; the default hosted-runner free disk
      # (~14 GB) can get tight and a mid-build "no space left on device" can
      # surface as an opaque cancellation. Reclaim ~20 GB of preinstalled
      # tooling this job never uses.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandboxes/openrind-shell/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/sandbox:just-bash
            ${{ env.IMAGE_BASE }}/sandbox:just-bash-sha-${{ github.sha }}
          cache-from: type=gha,scope=sandbox-just-bash
          cache-to: type=gha,mode=max,scope=sandbox-just-bash
