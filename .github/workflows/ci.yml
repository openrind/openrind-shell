name: CI

on:
  pull_request:
    branches: [nemo]
  push:
    branches: [nemo]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          package_json_file: openrind-desktop/package.json
      - name: Install Desktop workspace
        working-directory: openrind-desktop
        run: pnpm install --frozen-lockfile
      - name: Desktop OpenShell tests
        working-directory: openrind-desktop/apps/desktop
        run: pnpm test:openshell
      - name: OTLP unit and collector interoperability tests
        working-directory: openrind-desktop
        run: |
          pnpm --filter @openrind/capture test
          pnpm --filter @openrind/capture test:collector
      - name: Diagnostics suites under Electron's embedded Node
        working-directory: openrind-desktop/apps/desktop
        run: pnpm test:diagnostics:electron
      - name: Browser-pod unit and local transport tests
        working-directory: openrind-desktop
        run: |
          pnpm --filter @openrind/browser-pods test
          pnpm --filter @openrind/browser-pods test:transport
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -O2 -Wall -Wextra -Werror -fsyntax-only packages/browser-pods/native/helper.c
      - name: CTF service and judge tests
        working-directory: openrind-desktop
        run: pnpm --filter @openrind/ctf-runtime test
      - name: Electron typecheck
        working-directory: openrind-desktop/apps/desktop
        run: pnpm typecheck:electron
      - name: Browser pod artifact tests
        working-directory: sandboxes/browser-pod
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: App typecheck
        working-directory: openrind-desktop/apps/app
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openrind
          POSTGRES_PASSWORD: openrind
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openrind"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@11.22.0

      - name: Install dependencies
        working-directory: openeral-js
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: openeral-js
        run: pnpm typecheck

      - name: Lint
        working-directory: openeral-js
        run: pnpm lint

      - name: Unit tests
        working-directory: openeral-js
        run: pnpm test

      - name: Build
        working-directory: openeral-js
        run: pnpm build

      - name: Integration tests
        working-directory: openeral-js
        env:
          DATABASE_URL: postgresql://openrind:openrind@localhost:5432/testdb
        run: node test-integration.mjs

      - name: Validate sandbox scripts
        run: |
          python3 tests/test_excel_report_parser.py
          bash -n build-image.sh sandboxes/openeral/*.sh tests/*.sh tests/fuse/*.sh
          for script in sandboxes/openeral/*.mjs; do node --check "$script"; done

      - name: Check OpenHands sandbox adapter (no inference)
        run: |
          python3 -m venv /tmp/openrind-openhands-tests
          /tmp/openrind-openhands-tests/bin/pip install 'pytest==8.4.2' 'httpx==0.28.1'
          /tmp/openrind-openhands-tests/bin/python -m pytest tests/test_openhands_agent.py -q
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -O2 -Wall -Wextra -Werror -o /tmp/openrind-openhands-agent sandboxes/openeral/openhands-agent-launcher.c

  fuse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Openrind Shell FUSE daemon
        run: |
          cargo fmt --all --check
          cargo test -p openeral-fused
          cargo clippy -p openeral-fused --all-targets -- -D warnings

      - name: Check vendored OpenShell FUSE patch
        working-directory: vendor/openshell
        run: |
          cargo fmt --all --check
          cargo check -p openshell-cli -p openshell-driver-docker -p openshell-policy -p openshell-supervisor-process
