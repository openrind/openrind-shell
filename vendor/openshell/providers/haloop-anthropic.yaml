id: haloop-anthropic
display_name: Haloop Anthropic
description: Required Openrind Shell inference through the host-managed Haloop edge
category: agent
inference_capable: true
credentials:
  - name: client_token
    description: Scoped Haloop client token; this is not an upstream provider key
    env_vars: [HALOOP_CLIENT_TOKEN, ANTHROPIC_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
  - name: bearer_token
    description: Scoped Haloop Bearer token for OpenAI-compatible completions
    env_vars: [OPENAI_API_KEY, LLM_API_KEY]
    required: false
    auth_style: bearer
    header_name: Authorization
  - name: openrouter_key
    description: Optional OpenRouter API key for Haloop routing
    env_vars: [OPENROUTER_API_KEY]
    required: false
    auth_style: bearer
    header_name: x-w8-haloop-openrouter-key
  - name: admin_token
    description: Scoped BYOH admin token for Haloop reward rollouts
    env_vars: [ADMIN_TOKEN, W8_BYOH_ADMIN_TOKEN]
    required: false
    auth_style: header
    header_name: x-w8-haloop-admin-token
discovery:
  credentials: [client_token]
endpoints:
  - host: host.openshell.internal
    port: 8787
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: POST, path: "/v1/messages" }
      - allow: { method: POST, path: "/v1/messages/count_tokens" }
      - allow: { method: POST, path: "/v1/chat/completions" }
      - allow: { method: POST, path: "/chat/completions" }
  - host: 136.112.93.84
    port: 8787
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: POST, path: "/v1/messages" }
      - allow: { method: POST, path: "/v1/messages/count_tokens" }
      - allow: { method: POST, path: "/v1/chat/completions" }
      - allow: { method: POST, path: "/chat/completions" }
# Openrind Shell launches both agents through fixed native entrypoints. The
# generic Node interpreter used by OpenClaw is intentionally excluded.
binaries: [/usr/bin/claude, /usr/local/bin/claude, /usr/local/bin/claude-real, /usr/local/bin/openrind-openclaw-agent, /usr/local/bin/openrind-openhands-agent, /usr/bin/node]
