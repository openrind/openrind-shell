version: 1

# --- Sandbox setup configuration (queried once at startup) ---

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /opt
  read_write:
    - /sandbox
    - /tmp
    # configure-haloop.mjs atomically maintains the required shell export here.
    # Keep the grant limited to this Desktop-owned directory rather than making
    # all of /home/agent writable outside the FUSE workspace.
    - /home/agent/.openrind-shell
    - /var/lib/openrind-shell/runtime
    - /var/lib/openeral/runtime
    - /dev/null
    # The desktop PTY bridge creates one new Linux PTY for Claude. The
    # inherited OpenShell SSH PTY was opened before Landlock is applied, but
    # Python's os.openpty() must open the devpts multiplexer and slave after
    # Landlock is active. Without this directory the bridge dies silently
    # before its framed-readiness reset reaches xterm.
    #
    # Allow the real devpts directory, not the /dev/ptmx symlink: OpenShell
    # rejects ownership changes on the symlink during sandbox provisioning.
    - /dev/pts

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# The OpenShell supervisor validates this immutable declaration, mounts before
# its TSYNC seccomp prelude, then starts the daemon through the normal sandboxed
# child path. Claude never receives /dev/fuse or mount capability.
fuse_mounts:
  - binary: /usr/local/bin/openrind-shell-fused
    args: ["serve"]
    mountpoint: /sandbox/work
    fs_name: openrind-shell
    allow_other: false
    startup_timeout_seconds: 30

# --- Network policies (queried per-CONNECT request) ---
#
# Credential injection: stock OpenShell's SecretResolver automatically
# converts all provider credentials to placeholders and resolves them in
# the HTTP proxy for endpoints with `protocol: rest`. Current OpenShell
# terminates TLS automatically for inspectable routes.
# No secret_injection field needed — it's built into the proxy.

network_policies:

  # --- Required Haloop inference edge ---
  # The attached haloop-anthropic provider owns credential injection. Keep the
  # base sandbox policy aligned so composing policies cannot restore a direct
  # Anthropic or legacy metered-proxy bypass.
  haloop_anthropic:
    name: haloop-anthropic
    endpoints:
      - host: host.openshell.internal
        port: 8787
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/messages" }
          - allow: { method: POST, path: "/v1/messages/count_tokens" }
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: POST, path: "/chat/completions" }
      - host: 136.112.93.84
        port: 8787
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/messages" }
          - allow: { method: POST, path: "/v1/messages/count_tokens" }
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: POST, path: "/chat/completions" }
    binaries:
      - { path: /usr/bin/claude }
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/claude-real }
      - { path: /usr/local/bin/openrind-openclaw-agent }
      - { path: /usr/local/bin/openrind-openhands-agent }
      - { path: /usr/bin/node }

  # --- Claude telemetry and static resources (no inference credential) ---
  claude_support:
    name: claude-support
    endpoints:
      - { host: statsig.anthropic.com, port: 443 }
      - { host: sentry.io, port: 443 }
      - { host: raw.githubusercontent.com, port: 443 }
      - { host: platform.claude.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/claude-real }
      - { path: /usr/local/bin/openrind-openclaw-agent }
      - { path: /usr/local/bin/openrind-openhands-agent }

  # --- Socket.dev package registry ---
  # When --provider socket is configured with SOCKET_TOKEN, npm traffic
  # routes to registry.socket.dev. The proxy resolves the placeholder
  # SOCKET_TOKEN in auth headers through the inspectable REST route.
  # Restricted to read-only (GET) — npm install only reads the registry.
  # /usr/bin/node is required because npm is a shebang script — OpenShell's
  # policy engine matches the actual executable (/usr/bin/node), not the
  # script path (/usr/bin/npm) in argv[0].
  socket_packages:
    name: socket-packages
    endpoints:
      - host: registry.socket.dev
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/npm }
      - { path: /usr/bin/node }

  # --- npm (default registry, when Socket.dev is not configured) ---
  npm_registry:
    name: npm-registry
    endpoints:
      - { host: registry.npmjs.org, port: 443 }
    binaries:
      - { path: /usr/bin/npm }
      - { path: /usr/bin/node }
      - { path: /usr/bin/npx }

  # --- Git over HTTPS (read-only) ---
  github_ssh_over_https:
    name: github-ssh-over-https
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**/info/refs*"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
    binaries:
      - { path: /usr/bin/git }

  # --- GitHub REST API (read-only) ---
  github_rest_api:
    name: github-rest-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/gh }

  # --- PyPI ---
  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
      - { host: github.com, port: 443 }
      - { host: objects.githubusercontent.com, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: downloads.python.org, port: 443 }
    binaries:
      - { path: /sandbox/work/.venv/bin/python }
      - { path: /sandbox/work/.venv/bin/python3 }
      - { path: /sandbox/work/.venv/bin/pip }
      - { path: /app/.venv/bin/python }
      - { path: /app/.venv/bin/python3 }
      - { path: /app/.venv/bin/pip }
      - { path: /usr/local/bin/uv }
      - { path: "/sandbox/work/.uv/python/**" }

  # --- VS Code Remote ---
  vscode:
    name: vscode
    endpoints:
      - { host: update.code.visualstudio.com, port: 443 }
      - { host: az764295.vo.msecnd.net, port: 443 }
      - { host: vscode.download.prss.microsoft.com, port: 443 }
      - { host: marketplace.visualstudio.com, port: 443 }
      - { host: gallerycdn.vsassets.io, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/wget }
      - { path: "/sandbox/work/.vscode-server/**" }
      - { path: "/sandbox/work/.vscode-remote-containers/**" }

  # --- Cursor ---
  cursor:
    name: cursor
    endpoints:
      - { host: cursor.blob.core.windows.net, port: 443 }
      - { host: api2.cursor.sh, port: 443 }
      - { host: repo.cursor.sh, port: 443 }
      - { host: download.cursor.sh, port: 443 }
      - { host: cursor.download.prss.microsoft.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/wget }
      - { path: "/sandbox/work/.cursor-server/**" }

  # --- External PostgreSQL (Supabase) via HTTP CONNECT tunnel ---
  # pg traffic cannot bypass OpenShell's HTTP proxy — the sandbox netns REJECTs
  # all raw TCP. openeral-js wraps its pg socket with an HTTP CONNECT handshake
  # (see src/db/http-connect-socket.ts) so the proxy sees `CONNECT host:port`
  # from /usr/bin/node, allows it per this policy, and then bidirectionally
  # relays bytes. pg negotiates its own end-to-end TLS with Supabase inside
  # the tunnel. Current OpenShell auto-terminates detected TLS unless the
  # endpoint explicitly uses `tls: skip`; PostgreSQL is not HTTP and must use
  # a raw tunnel here.
  #
  # Current OpenShell accepts a wildcard in the first DNS label, so one pair
  # covers all regional Supabase pooler hosts without granting arbitrary
  # subdomains or raw PostgreSQL access outside this domain.
  postgres:
    name: postgres
    endpoints:
      # Supabase pooler — session mode (5432) and transaction mode (6543).
      # The FUSE runtime requires session mode and its init rejects 6543; the
      # compatibility runtime may use either.
      - { host: "*.pooler.supabase.com", port: 5432, tls: skip }
      - { host: "*.pooler.supabase.com", port: 6543, tls: skip }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/openrind-shell-fused }

  # --- Copilot ---
  copilot:
    name: copilot
    endpoints:
    - { host: github.com, port: 443 }
    - { host: api.github.com, port: 443 }
    - { host: api.githubcopilot.com, port: 443 }
    - { host: api.enterprise.githubcopilot.com, port: 443 }
    - { host: release-assets.githubusercontent.com, port: 443 }
    - { host: copilot-proxy.githubusercontent.com, port: 443 }
    - { host: default.exp-tas.com, port: 443 }
    binaries:
    - { path: /usr/lib/node_modules/@github/copilot/node_modules/@github/**/copilot }
